name: Secret scan

# Blokkeert een push of PR waarin een echte credential in een getrackt
# bestand staat. Bewust zelfstandig: geen externe action behalve checkout,
# zodat dit bestand identiek naar elke repo te kopieren is.
#
# Toegevoegd tijdens de stack-brede security-sweep van 3 september 2026.
# Het patroon komt uit claude-seo/.github/workflows/ci.yml, de enige repo
# die deze gate al had.

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Scan tracked files for leaked credentials
        run: |
          set -uo pipefail
          # Patronen met een hoog signaal: een treffer is vrijwel altijd een
          # echte sleutel. Test-fixtures en gedocumenteerde placeholders
          # staan op de allowlist hieronder.
          PATTERN='AIza[0-9A-Za-z_-]{35}|ghp_[A-Za-z0-9]{36}|github_pat_[A-Za-z0-9_]{40,}|gh[ous]_[A-Za-z0-9]{36}|AKIA[0-9A-Z]{16}|GOCSPX-[A-Za-z0-9_-]{20,}|sk-ant-[A-Za-z0-9_-]{20,}|sk-(proj-)?[A-Za-z0-9]{20,}|xox[baprs]-[A-Za-z0-9-]{10,}|-----BEGIN (RSA |EC |OPENSSH |DSA )?PRIVATE KEY-----'
          HITS=$(git ls-files -z \
            | xargs -0 grep -nIEH "$PATTERN" 2>/dev/null \
            | grep -vE 'DUMMY|EXAMPLE|YOUR_|REDACTED|placeholder|PLACEHOLDER|<[A-Za-z_-]+>|abcdefghijklmnop' \
            | grep -vE '\.test\.(mjs|js|ts):|(^|/)tests?/|\.lock:|package-lock\.json:' || true)
          if [ -n "$HITS" ]; then
            echo "::error::Mogelijke credential in getrackte bestanden:"
            echo "$HITS"
            echo ""
            echo "Is dit een placeholder of fixture? Vul de allowlist in dit bestand aan."
            echo "Is het een echte sleutel? Roteer hem eerst, verwijder hem daarna uit de historie."
            exit 1
          fi
          echo "Secret scan schoon: geen credentials in getrackte bestanden."
